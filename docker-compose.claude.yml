# 使用 Claude 订阅（Pro / Max / Team）作为 LLM Provider 的运行方式。
#
# 与 docker-compose.release.yml 的区别：
#   1. 构建 Dockerfile.claude，容器内包含 claude CLI；
#   2. 镜像构建时已把本仓库代码复制进镜像（Dockerfile.claude），因此只需
#      挂载 storage/ 与 config.toml，不再把整个项目目录读写挂载进容器；
#   3. 注入 CLAUDE_CODE_OAUTH_TOKEN，容器内没有 keychain，CLI 只能用
#      `claude setup-token` 生成的长期令牌完成鉴权。
#
# 令牌传递（推荐写入权限为 600 的 .env 文件，避免进入 shell 历史）：
#   umask 077; echo "CLAUDE_CODE_OAUTH_TOKEN=$(claude setup-token)" > .env
#   docker compose -f docker-compose.claude.yml up -d --build
# 也可以直接 export（令牌会出现在当前 shell 环境中）：
#   export CLAUDE_CODE_OAUTH_TOKEN="$(claude setup-token)"
# 令牌绝不能写入镜像或提交到 git（.env 已被 .gitignore / .dockerignore 排除）。
# 详见 docs/SECURITY-OPS.md。

x-common-build: &common-build
  context: .
  dockerfile: Dockerfile.claude

x-hardened: &hardened
  # Non-root runtime user. Default matches the image (UID/GID 10001). If your
  # bind-mounted ./storage and ./config.toml belong to your host user, run
  #   MPT_UID=$(id -u) MPT_GID=$(id -g) docker compose up -d
  # (note: plain $UID is a shell variable and is not exported to compose).
  user: "${MPT_UID:-10001}:${MPT_GID:-10001}"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp
  init: true

x-common-volumes: &common-volumes
  # Mount only runtime state; code and dependencies live in the image.
  - ./config.toml:/MoneyPrinterTurbo/config.toml
  - ./storage:/MoneyPrinterTurbo/storage

x-common-environment: &common-environment
  # 未设置令牌时直接让 compose 报错，避免容器起来后才在生成阶段失败。
  CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?run 'export CLAUDE_CODE_OAUTH_TOKEN="$(claude setup-token)"' first}

services:
  webui:
    build: *common-build
    container_name: "moneyprinterturbo-webui"
    <<: *hardened
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4).status == 200 else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "127.0.0.1:8501:8501"
    command: [ "streamlit", "run", "./webui/Main.py", "--server.address=0.0.0.0", "--server.port=8501", "--browser.serverAddress=127.0.0.1", "--server.enableCORS=True", "--browser.gatherUsageStats=False", "--client.toolbarMode=minimal", "--logger.hideWelcomeMessage=True", "--server.showEmailPrompt=False" ]
    volumes: *common-volumes
    environment: *common-environment
    restart: always
  api:
    build: *common-build
    container_name: "moneyprinterturbo-api"
    <<: *hardened
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/ping', timeout=4).status == 200 else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "127.0.0.1:8080:8080"
    command: [ "python3", "main.py" ]
    volumes: *common-volumes
    # 容器内部必须监听 0.0.0.0，宿主机端口已绑定 127.0.0.1，属于可信网络。
    environment:
      <<: *common-environment
      LISTEN_HOST: "0.0.0.0"
      ALLOW_UNAUTHENTICATED_REMOTE_API: "true"
    restart: always
